volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: agaldanova/kittygram_backend
    restart: always
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media
  frontend:
    image: agaldanova/kittygram_frontend
    restart: always
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: agaldanova/kittygram_gateway
    restart: always
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/static/
      - media_volume:/media/
    ports:
      - 9000:80
